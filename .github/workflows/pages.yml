# Publica o app no GitHub Pages, para dar um endereco https - que e' o que o
# iPhone exige para "Adicionar a Tela de Inicio" virar aplicativo de verdade.
#
# A primeira execucao tenta ligar o Pages sozinho. Se a organizacao nao
# permitir, ligue a mao em Settings > Pages > Build and deployment > Source:
# "GitHub Actions" e rode de novo. Depois disso, todo push na branch padrao
# republica o site.
name: Publicar no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test "test/*.test.js"
      - run: node build.js

  publicar:
    needs: testar
    # Publica so' a partir da branch padrao, seja qual for o nome dela: este
    # repositorio nao tem main, e fixar o nome deixaria o workflow mudo.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar o site
        run: node build.js

      # Sem enablement: testado nos dois estados do repositorio, o GITHUB_TOKEN
      # nao cria o site do Pages ("Resource not accessible by integration").
      # Ele publica no Pages, mas ligar o Pages e' ato de um humano com acesso
      # de admin. Tentar so' produzia um erro assustador antes do erro util.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explicar que o Pages precisa ser ligado a mao
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=Ligue o GitHub Pages uma vez::Abra Settings > Pages > Build and deployment e escolha Source: \"GitHub Actions\". E' uma vez so'; depois disso todo push publica sozinho. (Repositorio privado em plano gratuito nao tem Pages - nesse caso, publique a pasta site/ em outro servico estatico.)"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
