# Publica o app no GitHub Pages, para dar um endereco https - que e' o que o
# iPhone exige para "Adicionar a Tela de Inicio" virar aplicativo de verdade.
#
# A primeira execucao tenta ligar o Pages sozinho. Se a organizacao nao
# permitir, ligue a mao em Settings > Pages > Build and deployment > Source:
# "GitHub Actions" e rode de novo. Depois disso, todo push na branch padrao
# republica o site.
name: Publicar no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test "test/*.test.js"
      - run: node build.js

  publicar:
    needs: testar
    # Publica so' a partir da branch padrao, seja qual for o nome dela: este
    # repositorio nao tem main, e fixar o nome deixaria o workflow mudo.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar o site
        run: node build.js

      # O erro cru do configure-pages quando o Pages esta desligado e
      # "Resource not accessible by integration", que nao ajuda ninguem. Este
      # passo diz o que fazer - inclusive o caso de repositorio privado em
      # plano gratuito, onde o Pages simplesmente nao existe.
      - name: Conferir se o GitHub Pages esta ligado
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$codigo" = "404" ]; then
            echo "::error title=Pages desligado::Ligue em Settings > Pages > Source: GitHub Actions. Em repositorio PRIVADO isso exige plano pago (Pro/Team); no plano gratuito, ou torne o repositorio publico, ou publique a pasta site/ em outro servico estatico."
            exit 1
          fi
          echo "Pages respondeu $codigo - seguindo."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
